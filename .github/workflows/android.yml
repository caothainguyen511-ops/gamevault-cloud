name: GameVault Cloud Android
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply GameVault identity and Android build configuration
        run: bash scripts/prepare-gamevault.sh
      - name: Install streaming client dependencies
        working-directory: engine/opennow-stable
        run: npm install
      - name: Build cloud gaming client
        working-directory: engine/opennow-stable
        run: npm run build
      - name: Sync Capacitor Android project
        working-directory: engine/opennow-stable
        run: npx cap sync android
      - name: Build Android APK
        working-directory: engine/opennow-stable/android
        run: chmod +x gradlew && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GameVault-Cloud-playable-debug-apk
          path: engine/opennow-stable/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
